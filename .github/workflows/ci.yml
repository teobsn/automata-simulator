name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Run unit tests
        run: |
          python -m unittest discover -v tests

      - name: Test package installation
        run: |
          pip install .
          automata-sim DFA examples/dfa/contains_11/contains_11.dfa 11
          automata-sim NFA examples/nfa/ends_with_aa_or_bb/ends_with_aa_or_bb.nfa aabb
          automata-sim PDA examples/pda/zero_n_one_n/zero_n_one_n.pda 0011
          automata-sim CFG examples/cfg/an_bn/an_bn.cfg aabb --verify
